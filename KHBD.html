<head>

<title>Quản lý hồ sơ - Kế hoạch bài dạy giáo viên</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#eef4fa;color:#17324d}
header{background:linear-gradient(135deg,#0d3b66,#0876e8);color:white;text-align:center;padding:26px 18px 24px;box-shadow:0 4px 14px rgba(0,0,0,.16)}
header .school{font-size:17px;font-weight:700;letter-spacing:.7px}
header h1{margin:8px 0 4px;font-size:29px}
header .sub{font-size:14px;opacity:.93}
.container{max-width:1200px;margin:26px auto;padding:0 18px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.home,.team-btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;text-decoration:none}
.home{background:#213f5a;color:white}
.team-btn{background:#dceafe;color:#1253a4}
.team-btn.active{background:#0b7df0;color:white;box-shadow:0 4px 12px rgba(11,125,240,.25)}
.filters{background:white;border-radius:14px;padding:16px;display:grid;grid-template-columns:1.35fr 1fr 1fr 1fr auto;gap:12px;box-shadow:0 5px 18px rgba(0,0,0,.07);align-items:end}
.filter-group label{display:block;font-size:12px;font-weight:700;margin:0 0 6px;color:#345}
.filter-group input,.filter-group select{width:100%;padding:12px;border:1px solid #cbd8e6;border-radius:10px;background:white;font-size:14px}
.reset{padding:12px 14px;border:0;border-radius:10px;background:#edf1f5;font-weight:700;cursor:pointer}
.stats{margin:14px 0 10px;background:white;border:1px solid #dbe5ef;border-radius:12px;padding:11px 15px;font-weight:700;color:#1d5a93;display:flex;gap:16px;flex-wrap:wrap}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px}
.section-head h2{margin:0;font-size:23px;border-left:4px solid #0b7df0;padding-left:10px;color:#07559f}
.count{color:#60758a;font-size:14px}
.table-wrap{background:white;border-radius:14px;overflow:hidden;box-shadow:0 5px 18px rgba(0,0,0,.06)}
table{width:100%;border-collapse:collapse}
th{background:#eaf2fb;color:#174a7c;font-size:12px;text-align:left;padding:12px}
td{padding:12px;border-top:1px solid #e6edf5;font-size:14px}
td.name{font-weight:700}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#e7f0fb;color:#1764b3;font-size:12px;font-weight:700}
.site{background:#edf1f4;color:#54606c}
.type{background:#eef8ed;color:#2d7b3d}
.open{display:inline-block;background:#0b86f7;color:white;text-decoration:none;font-weight:700;padding:9px 14px;border-radius:999px;box-shadow:0 3px 8px rgba(11,134,247,.25)}
.cards{display:none}
.empty{padding:24px;text-align:center;color:#708090}
@media(max-width:900px){
  .filters{grid-template-columns:1fr 1fr}
  .reset{width:100%}
}
@media(max-width:700px){
  header h1{font-size:22px}
  .filters{grid-template-columns:1fr}
  table{display:none}
  .cards{display:grid;gap:12px;padding:12px}
  .card{border:1px solid #e0e8f1;border-radius:12px;padding:14px;background:white}
  .card h3{margin:0 0 8px;font-size:16px}
  .meta{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
  .open{width:100%;text-align:center}
}
</style>

  <div class="stats" id="stats"></div>

      <tbody id="teacherBody"></tbody>

    <div class="cards" id="teacherCards"></div>

</div>

const teams = ["KHTN - GDTC", "Ngữ văn - Thư viện", "Lịch sử - Địa lí - GDCD - Thiết bị", "Tiếng Anh - Nghệ thuật", "Toán - Tin - Công nghệ"];
let currentTeam = teams[0];

const teamButtons = document.getElementById('teamButtons');
const searchBox = document.getElementById('searchBox');
const subjectFilter = document.getElementById('subjectFilter');
const siteFilter = document.getElementById('siteFilter');
const typeFilter = document.getElementById('typeFilter');
const teacherBody = document.getElementById('teacherBody');
const teacherCards = document.getElementById('teacherCards');
const stats = document.getElementById('stats');
const countText = document.getElementById('countText');
const emptyMsg = document.getElementById('emptyMsg');

function normalize(s){
  return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
}

function renderTeamButtons(){
  teamButtons.innerHTML = '';
  teams.forEach(team => {
    const b = document.createElement('button');
    b.className = 'team-btn' + (team===currentTeam ? ' active' : '');
    b.textContent = team;
    b.onclick = () => {
      currentTeam = team;
      searchBox.value = '';
      siteFilter.value = '';
      typeFilter.value = '';
      updateSubjectOptions();
      renderTeamButtons();
      render();
    };
    teamButtons.appendChild(b);
  });
}

function updateSubjectOptions(){
  const subjects = [...new Set(teachers.filter(t=>t.team===currentTeam).map(t=>t.subject))].sort((a,b)=>a.localeCompare(b,'vi'));
  subjectFilter.innerHTML = '<option value="">Tất cả</option>' + subjects.map(s=>`<option value="${s}">${s}</option>`).join('');
}

function filtered(){
  const q = normalize(searchBox.value);
  return teachers.filter(t =>
    t.team===currentTeam &&
    (!q || normalize(t.name).includes(q)) &&
    (!subjectFilter.value || t.subject===subjectFilter.value) &&
    (!siteFilter.value || t.site===siteFilter.value) &&
    (!typeFilter.value || t.type===typeFilter.value)
  );
}

function render(){
  const list = filtered();
  teacherBody.innerHTML = '';
  teacherCards.innerHTML = '';
  emptyMsg.style.display = list.length ? 'none' : 'block';

  list.forEach((t,i)=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${i+1}</td>
      <td class="name">👤 ${t.name}</td>
      <td><span class="badge">${t.team}</span></td>
      <td><span class="badge">${t.subject}</span></td>
      <td><span class="badge site">${t.site}</span></td>
      <td><span class="badge type">${t.type}</span></td>
      <td><a class="open" href="${t.link}" target="_blank">📁 Truy cập</a></td>`;
    teacherBody.appendChild(tr);

    const card = document.createElement('div');
    card.className='card';
    card.innerHTML = `<h3>👤 ${t.name}</h3>
      <div class="meta">
        <span class="badge">${t.team}</span>
        <span class="badge">${t.subject}</span>
        <span class="badge site">${t.site}</span>
        <span class="badge type">${t.type}</span>
      </div>
      <a class="open" href="${t.link}" target="_blank">📁 Truy cập hồ sơ</a>`;
    teacherCards.appendChild(card);
  });

  const dc = list.filter(t=>t.site==='ĐC').length;
  const ph1 = list.filter(t=>t.site==='PH1').length;
  const ph2 = list.filter(t=>t.site==='PH2').length;
  const bc = list.filter(t=>t.type==='Biên chế').length;
  const hd = list.filter(t=>t.type==='Hợp đồng').length;
  stats.innerHTML = `<span>${currentTeam}</span><span>Đang hiển thị: ${list.length} GV</span><span>ĐC: ${dc}</span><span>PH1: ${ph1}</span><span>PH2: ${ph2}</span><span>Biên chế: ${bc}</span><span>Hợp đồng: ${hd}</span>`;
  countText.textContent = `${list.length} giáo viên`;
}

document.getElementById('resetBtn').onclick = () => {
  searchBox.value=''; subjectFilter.value=''; siteFilter.value=''; typeFilter.value=''; render();
};
searchBox.addEventListener('input', render);
subjectFilter.addEventListener('change', render);
siteFilter.addEventListener('change', render);
typeFilter.addEventListener('change', render);

renderTeamButtons();
updateSubjectOptions();
render();
</script>
